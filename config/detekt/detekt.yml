# detekt config — buildUponDefaultConfig=true, chỉ override (lý do: docs/DECISIONS.md)
# Tên section theo default-detekt-config.yml của detekt 1.23.8 (đã đối chiếu source)
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    constructorThreshold: 10
  LongMethod:
    active: false # hàm Composable màn hình thường dài — kiểm soát bằng review
  CyclomaticComplexMethod:
    threshold: 20
  TooManyFunctions:
    thresholdInFiles: 20

style:
  MagicNumber:
    active: false # số dp/ms trong UI Compose là bình thường
  ForbiddenComment:
    active: false # cho phép TODO(Mx)/FIXME có chủ đích, có ghi milestone
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true

naming:
  MatchingDeclarationName:
    active: false # cho phép file gom nhiều khai báo nhỏ (Models.kt, DTOs...)
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false # CompositionLocal theo convention PascalCase

exceptions:
  TooGenericExceptionCaught:
    active: false # engine cần bắt Exception/Throwable để map sang errorCode (SPEC §9.2)
