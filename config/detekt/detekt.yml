# detekt config — buildUponDefaultConfig=true, chỉ override (lý do: docs/DECISIONS.md)
# Tên section theo default-detekt-config.yml của detekt 1.23.8 (đã đối chiếu source)
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true # factory test dùng default param
  LongMethod:
    active: false # hàm Composable màn hình thường dài — kiểm soát bằng review
  CyclomaticComplexMethod:
    threshold: 20
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 25
    thresholdInInterfaces: 25 # interface API/gateway/DAO định nghĩa đủ surface của domain
    ignorePrivate: true # thống kê file; interface API/gateway/DAO nhiều hàm là bản chất
  NestedBlockDepth:
    threshold: 5 # engine có try/catch + retry loop + if lồng nhau là bản chất

style:
  MagicNumber:
    active: false # số dp/ms trong UI Compose là bình thường
  ForbiddenComment:
    active: false # cho phép TODO(Mx)/FIXME có chủ đích, có ghi milestone
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    active: false # engine/map lỗi cần throw theo nhánh mã lỗi (SPEC §9.2)
  MaxLineLength:
    active: false # ktlint đã kiểm tra; test chứa JSON fixture dài

naming:
  MatchingDeclarationName:
    active: false # cho phép file gom nhiều khai báo nhỏ (Models.kt, DTOs...)
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false # CompositionLocal theo convention PascalCase

exceptions:
  TooGenericExceptionCaught:
    active: false # engine cần bắt Exception/Throwable để map sang errorCode (SPEC §9.2)
  SwallowedException:
    active: false # nhiều catch là chuyển tiếp có chủ đích: map sang AppError hoặc assert bằng kiểu exception

empty-blocks:
  EmptyFunctionBlock:
    active: false # override setter no-op trong fake test + callback rỗng là hợp lệ
