name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # gradle-wrapper.jar đã commit sẵn trong repo — setup-gradle chỉ để cache
      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint + detekt + lint + unit tests + assembleDebug
        run: ./gradlew --stacktrace ktlintCheck detekt lintDebug testDebugUnitTest assembleDebug

      # Cho phép kiểm thử không cần Android Studio: tải APK + báo cáo test từ trang Actions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
