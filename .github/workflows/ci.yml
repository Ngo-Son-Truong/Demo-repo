name: CI

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # gradle-wrapper.jar đã commit sẵn trong repo — setup-gradle chỉ để cache
      - uses: gradle/actions/setup-gradle@v4

      # Tách từng bước + tee log ra file để bước comment đọc được khi thất bại
      - name: ktlintCheck
        run: ./gradlew --stacktrace ktlintCheck 2>&1 | tee /tmp/step-output.log

      - name: detekt
        run: ./gradlew --stacktrace detekt 2>&1 | tee /tmp/step-output.log

      - name: testDebugUnitTest
        run: ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee /tmp/step-output.log

      - name: lintDebug
        run: ./gradlew --stacktrace lintDebug 2>&1 | tee /tmp/step-output.log

      - name: assembleDebug
        run: ./gradlew --stacktrace assembleDebug 2>&1 | tee /tmp/step-output.log

      # Gói APK + báo cáo để publish ra release (link tải ổn định, không cần Android Studio)
      # Chẩn đoán ghi vào release notes (đọc được qua API khi không xem được log)
      - name: Gói kết quả build
        if: success()
        run: |
          mkdir -p /tmp/dist
          {
            echo "### APK tìm thấy:"
            find app/build -name "*.apk" 2>&1 || true
            echo ""
            echo "### app/build/outputs:"
            ls -laR app/build/outputs 2>&1 | head -60 || true
          } > /tmp/diag.txt || true
          find app/build -name "*.apk" -exec cp {} /tmp/dist/ \; >>/tmp/diag.txt 2>&1 || true
          if [ -d app/build/reports ]; then
            (cd app/build && zip -qr /tmp/dist/build-reports.zip reports test-results) || true
          fi
          { echo ""; echo "### /tmp/dist:"; ls -la /tmp/dist 2>&1 || true; } >> /tmp/diag.txt || true
          exit 0

      - name: Publish release ci-debug
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-debug >/dev/null 2>&1 || \
            gh release create ci-debug --prerelease --target "${{ github.sha }}" \
              --title "CI debug build" \
              --notes "APK debug + báo cáo test mới nhất từ CI (tự động ghi đè mỗi lần build xanh)."
          shopt -s nullglob
          files=(/tmp/dist/*)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload ci-debug "${files[@]}" --clobber
          fi
          gh release edit ci-debug --notes-file /tmp/diag.txt || true

      # Tóm tắt kết quả vào PR (thành công hoặc thất bại) — đọc được qua API
      - name: Tóm tắt CI vào PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BRANCH="${HEAD_REF:-$REF_NAME}"
          PR_NUMBER=$(gh api "repos/${REPO}/pulls?head=${REPO%/*}:${BRANCH}&state=open" --jq '.[0].number' 2>/dev/null || true)
          {
            if [ "$JOB_STATUS" = "success" ]; then
              echo "## ✅ CI xanh — ktlint · detekt · unit test · lint · assembleDebug"
              echo ""
              echo "- APK: https://github.com/${REPO}/releases/download/ci-debug/app-debug.apk"
              echo "- Báo cáo test/lint: https://github.com/${REPO}/releases/download/ci-debug/build-reports.zip"
            else
              echo "## ❌ CI thất bại — trích đoạn log bước lỗi"
              echo ""
              echo '<details><summary>Chi tiết (tail log)</summary>'
              echo ""
              echo '```text'
              tail -c 50000 /tmp/step-output.log 2>/dev/null || echo "(không đọc được log)"
              echo '```'
              echo "</details>"
            fi
          } > /tmp/ci-summary.md
          [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] && \
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/ci-summary.md || true
