name: CI

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # gradle-wrapper.jar đã commit sẵn trong repo — setup-gradle chỉ để cache
      - uses: gradle/actions/setup-gradle@v4

      # Redirect thẳng vào file (KHÔNG pipe qua tee — pipefail che mất exit code).
      # Tách từng bước để biết chính xác bước nào hỏng.
      - name: ktlintCheck
        run: ./gradlew --stacktrace ktlintCheck > /tmp/step-output.log 2>&1

      - name: detekt
        run: ./gradlew --stacktrace detekt > /tmp/step-output.log 2>&1

      - name: testDebugUnitTest
        run: ./gradlew --stacktrace testDebugUnitTest > /tmp/step-output.log 2>&1

      - name: lintDebug
        run: ./gradlew --stacktrace lintDebug > /tmp/step-output.log 2>&1

      - name: assembleDebug
        run: ./gradlew --stacktrace assembleDebug > /tmp/step-output.log 2>&1

      # Chạy DÙ THÀNH CÔNG HAY THẤT BẠI: gói log + APK + báo cáo
      - name: Gói kết quả build
        if: always()
        run: |
          mkdir -p /tmp/dist
          {
            echo "## Chẩn đoán CI (job status: ${{ job.status }})"
            echo ""
            echo "### Phần 'What went wrong' (nếu có):"
            grep -B2 -A 25 "What went wrong" /tmp/step-output.log 2>/dev/null || echo "(không có — build không lỗi ở bước cuối)"
            echo ""
            echo "### Ktlint violations (txt reports):"
            find /home/runner/work -path "*reports/ktlint*" -name "*.txt" 2>/dev/null | while read -r f; do
              echo "--- $f"
              cat "$f"
            done || true
            echo ""
            echo "### Detekt report (nếu có):"
            find /home/runner/work -path "*reports/detekt*" -name "*.txt" 2>/dev/null | while read -r f; do
              echo "--- $f"
              head -60 "$f"
            done || true
            echo ""
            echo "### Tail log bước cuối:"
            tail -40 /tmp/step-output.log 2>&1 || true
            echo ""
            echo "### APK tìm thấy:"
            find /home/runner/work -name "*.apk" 2>/dev/null | head -10 || true
          } > /tmp/diag.txt || true
          find /home/runner/work -name "*.apk" -exec cp {} /tmp/dist/ \; 2>>/tmp/diag.txt || true
          REPORTS_DIR=$(find /home/runner/work -maxdepth 4 -type d -path "*app/build" 2>/dev/null | head -1)
          if [ -n "$REPORTS_DIR" ] && [ -d "$REPORTS_DIR/reports" ]; then
            (cd "$REPORTS_DIR" && zip -qr /tmp/dist/build-reports.zip reports test-results) || true
          fi
          exit 0

      - name: Publish release ci-debug
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-debug >/dev/null 2>&1 || \
            gh release create ci-debug --prerelease --target "${{ github.sha }}" \
              --title "CI debug build" \
              --notes "Kết quả CI mới nhất (tự động ghi đè mỗi lần chạy)."
          shopt -s nullglob
          files=(/tmp/dist/*)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload ci-debug "${files[@]}" --clobber
          fi
          gh release edit ci-debug --notes-file /tmp/diag.txt || true

      # Tóm tắt vào PR nếu có PR đang mở cho branch này
      - name: Tóm tắt CI vào PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          BRANCH="${HEAD_REF:-$REF_NAME}"
          PR_NUMBER=$(gh api "repos/${REPO}/pulls?head=${REPO%/*}:${BRANCH}&state=open" --jq '.[0].number' 2>/dev/null || true)
          {
            if [ "$JOB_STATUS" = "success" ]; then
              echo "## ✅ CI xanh — ktlint · detekt · unit test · lint · assembleDebug"
              echo ""
              echo "- APK: https://github.com/${REPO}/releases/download/ci-debug/app-debug.apk"
              echo "- Báo cáo test/lint: https://github.com/${REPO}/releases/download/ci-debug/build-reports.zip"
            else
              echo "## ❌ CI thất bại — xem chẩn đoán trong release notes:"
              echo "https://github.com/${REPO}/releases/tag/ci-debug"
            fi
          } > /tmp/ci-summary.md
          [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] && \
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/ci-summary.md || true
