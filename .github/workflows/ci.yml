name: CI

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # gradle-wrapper.jar đã commit sẵn trong repo — setup-gradle chỉ để cache
      - uses: gradle/actions/setup-gradle@v4

      # Tách từng bước + tee log ra file để bước comment đọc được khi thất bại
      - name: ktlintCheck
        run: ./gradlew --stacktrace ktlintCheck 2>&1 | tee /tmp/step-output.log

      - name: detekt
        run: ./gradlew --stacktrace detekt 2>&1 | tee /tmp/step-output.log

      - name: testDebugUnitTest
        run: ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee /tmp/step-output.log

      - name: lintDebug
        run: ./gradlew --stacktrace lintDebug 2>&1 | tee /tmp/step-output.log

      - name: assembleDebug
        run: ./gradlew --stacktrace assembleDebug 2>&1 | tee /tmp/step-output.log

      # Khi thất bại: comment phần đuôi log vào PR (đọc được qua API)
      - name: Comment failure excerpt vào PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          {
            echo "## ❌ CI thất bại — trích đoạn log bước lỗi"
            echo ""
            echo '<details><summary>Chi tiết (tail log)</summary>'
            echo ""
            echo '```text'
            tail -c 55000 /tmp/step-output.log 2>/dev/null || echo "(không đọc được log)"
            echo '```'
            echo "</details>"
          } > /tmp/ci-report.md
          [ -n "$PR_NUMBER" ] && gh pr comment "$PR_NUMBER" --body-file /tmp/ci-report.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
